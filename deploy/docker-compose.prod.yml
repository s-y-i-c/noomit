# 프로덕션 배포용 compose 파일. 인스턴스가 1GB RAM(OCI Always Free E2.1.Micro)이라
# 서비스별 mem_limit 을 명시적으로 잡아 한 컨테이너가 메모리를 독점해 나머지가
# OOM 나는 상황을 막는다. 합계는 스왑 2GB를 감안해도 호스트 여유분을 남기도록 잡았다.
#
# 이미지는 CI에서 미리 빌드해 GHCR 로 push 한 것을 pull 해서 쓴다 — 1GB 인스턴스에서
# 직접 gradle test/build 나 next build 를 돌리면 메모리 부족으로 죽는다.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # POSTGRES_USER/POSTGRES_PASSWORD 는 .env.prod 에서 직접 그 이름으로 내려온다.
    # environment: 블록의 ${...} 는 compose 파일 자체를 파싱할 때 셸/`.env` 파일에서만
    # 치환되는 값이라 env_file 로 넘긴 값을 여기서 ${DB_USERNAME} 처럼 참조할 수 없다.
    env_file: .env.prod
    environment:
      POSTGRES_DB: noomit
    # 호스트 루프백에만 게시한다 — 인스턴스에 SSH 로 들어온 사람만 127.0.0.1:5432 로
    # DB 에 닿을 수 있고(팀원 DBeaver 는 SSH 터널을 거침), 인터넷에는 노출되지 않는다.
    # 0.0.0.0 로 열면 공인 IP 로 DB 가 그대로 노출되므로 반드시 127.0.0.1 로 바인딩한다.
    ports:
      - "127.0.0.1:5432:5432"
    # 기본 shared_buffers(128MB)는 1GB 인스턴스엔 과하다.
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=20
    volumes:
      - noomit-db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ 는 컨테이너 안에서 셸이 런타임에 풀어주는 환경변수 참조 — 위와 같은 이유로
      # compose 파싱 시점 치환(${...})이 아니라 컨테이너 실행 시점 치환을 써야 한다.
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d noomit']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 128m

  backend:
    image: ghcr.io/s-y-i-c/noomit-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 컨테이너 안에서 spring.config.import 의 ../.env 는 존재하지 않으므로(optional),
      # 필요한 값은 전부 env_file(.env.prod)로 주입한다.
      JAVA_TOOL_OPTIONS: >-
        -Xmx256m -Xss256k -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC
    # actuator 지표(/actuator/prometheus)를 로컬 Prometheus 가 긁어갈 수 있도록
    # 호스트 루프백에만 게시한다 — DB(127.0.0.1:5432)와 같은 패턴.
    # 개발자는 SSH 터널(ssh -L 8080:localhost:8080 ...)로만 닿고, 인터넷에는 노출되지 않는다.
    # 0.0.0.0 로 열면 actuator 가 공인 IP 로 그대로 노출되므로 반드시 127.0.0.1 로 바인딩한다.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m

  frontend:
    # NEXT_PUBLIC_API_URL 은 빌드 시점에 이미 이미지에 박혀 있다(frontend/Dockerfile 참고).
    image: ghcr.io/s-y-i-c/noomit-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    mem_limit: 200m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    mem_limit: 32m

volumes:
  noomit-db-data:
