# HTTPS/certbot 은 다음 단계에서 추가한다 — 인증서가 없는 상태에서 443 을 먼저 만들 수
# 없으므로(닭-달걀 문제), 지금은 80 만 열고 인증서 발급(webroot 챌린지)까지 이걸로 통과시킨다.

server {
    listen 80;
    server_name noomit.abcganada.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    location / {
        proxy_pass http://frontend:3000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }
}
