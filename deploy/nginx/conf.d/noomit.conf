server {
    listen 80;
    server_name noomit.abcganada.xyz;

    # 인증서 갱신용 webroot 챌린지는 HTTP로만 온다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name noomit.abcganada.xyz;

    ssl_certificate     /etc/letsencrypt/live/noomit.abcganada.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noomit.abcganada.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    location / {
        proxy_pass http://frontend:3000;
        include /etc/nginx/conf.d/proxy-common.conf;
    }
}
