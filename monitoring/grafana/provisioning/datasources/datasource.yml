# Grafana 컨테이너가 읽는 설정. "어디서 데이터를 가져올지"를 정의한다.
# 핵심: datasource 주소 = http://prometheus:9090 (같은 compose 네트워크의 Prometheus 컨테이너)
# 관계: Prometheus → 여기서 데이터를 꺼내간다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # 같은 compose 네트워크 안의 prometheus 서비스명으로 접근 — 컨테이너 간 통신이라
    # host.docker.internal 이 아니라 서비스명을 그대로 쓴다.
    url: http://prometheus:9090
    isDefault: true
    editable: false
