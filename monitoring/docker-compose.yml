# 로컬 전용 모니터링 스택. 운영 서버에 배포되지 않는다.
# 각자 로컬 PC에서 띄우고, SSH 터널로 운영 backend 의 actuator 지표를 긁어온다.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # 컨테이너에서 호스트(내 PC)를 가리키게 한다.
      # PC에 SSH 터널이 열려 있기 때문에 localhost:8080으로 설정하면 도커 컨테이너 내부를 가리킨다.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      # 읽기 전용으로 마운트 — 데이터소스/대시보드가 코드로 고정되고,
      # Grafana 를 켜는 순간 수동 설정 없이 바로 뜬다.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
